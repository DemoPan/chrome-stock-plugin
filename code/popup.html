<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="tab-bar">
    <div class="tab active">
      <span class="ts-icon">TS</span> runtime.spec.ts
      <span class="close-btn" id="boss-key" title="Boss Key (ESC)">×</span>
    </div>
    <div class="tab" id="fake-tab">daemon.cpp</div>
  </div>

  <div id="main-editor">
    <div class="main-layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <input type="text" id="symbol-input" placeholder="Search module..." spellcheck="false" title="回车添加 (支持逗号)" />
        </div>
        <div class="stock-list" id="stock-list"></div>
      </div>

      <div class="content-panel">
        <div id="detail-code"></div>
        <div class="chart-wrap">
          <div class="code-line">
            <span class="cm" id="chart-title" title="点击切换：分时 / 日线" style="cursor: pointer;">// STATS: none</span>
          </div>
          <div class="canvas-wrap">
            <!-- 高度增加到 130 -->
            <canvas id="sparkline" width="340" height="130"></canvas>
            <div id="hover-tip" class="hover-tip"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="editor hidden" id="boss-editor" style="padding: 10px;">
    <div class="code-line"><span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span></div>
    <div class="code-line"><span class="kw">#include</span> <span class="str">&lt;vector&gt;</span></div>
    <div class="code-line"><span class="kw">int</span> <span class="fn">main</span>() {</div>
    <div class="code-line">&nbsp;&nbsp;<span class="cm">// Memory allocation check</span></div>
    <div class="code-line">&nbsp;&nbsp;<span class="kw">const size_t</span> CAP = <span class="num">8192</span>;</div>
    <div class="code-line">&nbsp;&nbsp;std::vector&lt;<span class="kw">int</span>&gt; v(CAP, <span
        class="num">0</span>);</div>
    <div class="code-line">&nbsp;&nbsp;<span class="kw">return</span> <span class="num">0</span>;</div>
    <div class="code-line">}</div>
  </div>

  <div class="status-bar">
    <span id="status-msg">watch: 3s</span>
    <span id="update-time">sync: --:--:--</span>
    <span>UTF-8</span>
    <span id="refresh-btn" style="cursor:pointer" title="立即刷新">TS 5.4.2</span>
  </div>

  <script src="popup.js"></script>
</body>

</html>
